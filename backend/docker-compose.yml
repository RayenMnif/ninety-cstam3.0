version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: esports_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esports_venue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema on container initialization
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: always

  redis:
    image: redis:7-alpine
    container_name: esports_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
